services:
  postgres:
    image: postgres:16-alpine
    container_name: foosball-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-babyfoot}
      POSTGRES_USER: ${POSTGRES_USER:-babyfoot_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: Europe/Paris
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./babyfoot.sql:/seed/babyfoot.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-net

  fastapi:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: foosball-fastapi
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      TIMEZONE: Europe/Paris
      AUTO_POPULATE_IF_EMPTY: "false"
      NAMES_PRIVACY_PASSWORD: ${NAMES_PRIVACY_PASSWORD:-}
      NAMES_PRIVACY_SESSION_SECRET: ${NAMES_PRIVACY_SESSION_SECRET:-}
      NAMES_PRIVACY_SESSION_MAX_AGE_SECONDS: ${NAMES_PRIVACY_SESSION_MAX_AGE_SECONDS:-2592000}
      NAMES_VISIBLE_IPS: ${NAMES_VISIBLE_IPS:-}
      NAMES_TRUSTED_PROXY_IPS: ${NAMES_TRUSTED_PROXY_IPS:-}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - app-net

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: foosball-frontend
    environment:
      INTERNAL_API_BASE: "http://fastapi:8000"
    depends_on:
      - fastapi
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - app-net

  nginx:
    image: nginx:1.27-alpine
    container_name: foosball-nginx
    depends_on:
      - fastapi
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - app-net

volumes:
  postgres_data:

networks:
  app-net:
    driver: bridge
