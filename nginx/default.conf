server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Cloudflare Tunnel reaches Nginx through the host/Docker bridge. Trust the
    # visitor address supplied by Cloudflare only from those internal peers.
    # Requests reaching the published port from any other address cannot spoof
    # CF-Connecting-IP and keep their actual socket address instead.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://fastapi:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        proxy_pass http://fastapi:8000/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://fastapi:8000/docs;
    }

    location = /openapi.json {
        proxy_pass http://fastapi:8000/openapi.json;
    }

    location = /redoc {
        proxy_pass http://fastapi:8000/redoc;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
